# prek configuration for ds-operator
# Runs the same quick checks as CI before each commit.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
    { id = "check-merge-conflict" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "go-generate", name = "generate deepcopy & manifests", entry = "make generate manifests", language = "system", pass_filenames = false, types = ["go"], stages = ["pre-commit"] },
    { id = "go-fmt", name = "go fmt", entry = "go fmt ./...", language = "system", pass_filenames = false, types = ["go"], stages = ["pre-commit"] },
    { id = "go-vet", name = "go vet", entry = "go vet ./...", language = "system", pass_filenames = false, types = ["go"], stages = ["pre-commit"] },
    { id = "golangci-lint", name = "golangci-lint", entry = "make lint", language = "system", pass_filenames = false, types = ["go"], stages = ["pre-commit"] },
    { id = "go-build", name = "go build", entry = "go build ./...", language = "system", pass_filenames = false, types = ["go"], stages = ["pre-commit"] },
    { id = "go-test", name = "unit tests", entry = "make test", language = "system", pass_filenames = false, types = ["go"], stages = ["pre-commit"] },
]
